<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ODG JERSEYS | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>ODG JERSEYS Admin</h1>

  <h2>Add New Jersey</h2>

  <form id="productForm">

    <label>
      Jersey Name
      <input
        type="text"
        id="productName"
        required
      >
    </label>

    <br><br>

    <label>
      Price
      <input
        type="number"
        id="productPrice"
        required
      >
    </label>

    <br><br>

   <label>
  Categories
  <select id="productCategory" multiple required>
    <option value="club">Club</option>
    <option value="national">National</option>
    <option value="retro">Retro</option>
    <option value="current">Current Jerseys</option>
    <option value="best">Best Sellers</option>
    <option value="new">New Arrivals</option>
  </select>
</label>

    <br><br>

    <label>
      Image
      <input
        type="file"
        id="productImage"
        accept="image/*"
        required
      >
    </label>

    <br><br>

    <label>
      Description
      <textarea
        id="productDescription"
        rows="4"
      ></textarea>
    </label>

    <br><br>

    <button type="submit">
      Add Jersey
    </button>

  </form>

  <p id="status"></p>
  <hr>

<h2>Delete Jersey</h2>

<select id="deleteProduct">
  <option value="">Select jersey to delete</option>
</select>

<button type="button" id="deleteButton">Delete Jersey</button>

<hr>

<h2>Edit Jersey</h2>

<select id="editProduct">
  <option value="">Select jersey to edit</option>
</select>

<br><br>

<input type="text" id="editName" placeholder="Jersey Name">

<br><br>

<input type="number" id="editPrice" placeholder="Price">

<br><br>

<select id="editCategory" multiple>
  <option value="">Select category</option>
  <option value="club">Club</option>
  <option value="national">National</option>
  <option value="retro">Retro</option>
   <option value="current">Current Jerseys</option>
    <option value="best">Best Sellers</option>
    <option value="new">New Arrivals</option>
</select>

<br><br>

<textarea id="editDescription" rows="4" placeholder="Description"></textarea>
<br><br>

<button type="button" id="updateButton">Save Changes</button>
  <hr>

<h2>Existing Jerseys</h2>

<div id="productsList">
  Loading products...
</div>

  <script src="admin.js"></script>

</body>
</html>
